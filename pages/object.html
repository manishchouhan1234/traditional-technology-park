<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Object | Traditional Technology Park</title>

  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <header class="inner-header">

    <a href="agriculture.html" class="back-link">
      ← Back to Collection
    </a>

    <div class="language-label">
      पारंपरिक प्रौद्योगिकी पार्क
    </div>

  </header>


  <main id="object-page">

    <section class="object-hero">

      <div class="object-hero-image">
        <img id="object-image" src="" alt="">
      </div>

      <div class="object-hero-content">

        <p class="eyebrow" id="object-category"></p>

        <h1 id="object-name"></h1>

        <h2 id="object-hindi"></h2>

        <p id="object-short"></p>

        <p id="object-short-hindi"></p>

      </div>

    </section>


    <section class="object-introduction">

      <p class="eyebrow">
        INTRODUCTION · परिचय
      </p>

      <h2 id="object-intro-title"></h2>

      <p id="object-description"></p>

      <p id="object-description-hindi"></p>

    </section>


    <section class="object-details">

      <div class="detail-block">
        <span>REGION</span>
        <strong id="object-region"></strong>
        <p id="object-region-hindi"></p>
      </div>

      <div class="detail-block">
        <span>DISTRICT</span>
        <strong id="object-district"></strong>
        <p id="object-district-hindi"></p>
      </div>

      <div class="detail-block">
        <span>COMMUNITY</span>
        <strong id="object-community"></strong>
        <p id="object-community-hindi"></p>
      </div>

      <div class="detail-block">
        <span>TYPE</span>
        <strong id="object-type"></strong>
        <p id="object-type-hindi"></p>
      </div>

    </section>


    <section class="object-story">

      <div>

        <p class="eyebrow">
          HOW IT WORKS · कैसे काम करता है
        </p>

        <h2 id="object-how-title"></h2>

      </div>

      <div>

        <p id="object-how"></p>

        <p id="object-how-hindi"></p>

      </div>

    </section>


    <section class="object-importance">

      <p class="eyebrow">
        SIGNIFICANCE · महत्व
      </p>

      <h2 id="object-significance-title"></h2>

      <p id="object-significance"></p>

      <p id="object-significance-hindi"></p>

    </section>


    <section class="object-source">

      <p class="eyebrow">
        MUSEUM RECORD · संग्रहालय अभिलेख
      </p>

      <p id="object-source"></p>

    </section>

  </main>


  <footer>

    <p>
      Traditional Technology Park · IGRMS
    </p>

  </footer>


  <script src="../script.js"></script>

</html>
